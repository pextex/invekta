services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: crm
      POSTGRES_DB: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Postavite POSTGRES_PASSWORD u .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - crm_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  crm_data:
