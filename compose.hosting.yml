# Existing company database; no demo seed or data reset is run on startup.
services:
  crm:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env.production
    environment:
      PORT: '3000'
      CRM_COOKIE_SECURE: 'true'
    ports:
      - '127.0.0.1:3000:3000'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:3000/api/ready", timeout=5)']
      interval: 30s
      timeout: 8s
      start_period: 60s
      retries: 3
