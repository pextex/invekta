[project]
name = "luu-invekta-api"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3",
]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
