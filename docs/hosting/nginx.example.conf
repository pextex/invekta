# Replace the domain and certificate paths with the company's issued certificate.
server {
    listen 80;
    server_name crm.example.rs;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name crm.example.rs;
    ssl_certificate /etc/letsencrypt/live/crm.example.rs/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.example.rs/privkey.pem;
    client_max_body_size 11m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s;
    }
}
